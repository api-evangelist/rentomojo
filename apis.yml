name: Rentomojo
description: 'Rentomojo is India''s largest tech-driven, full-stack direct-to-consumer
  furniture and appliance rental platform, converting ownership into flexible monthly
  subscriptions. Customers rent beds, sofas, wardrobes, refrigerators, washing machines,
  air conditioners, water purifiers and other home essentials on plans from roughly
  three to thirty-six months, with delivery, installation, maintenance, relocation
  and upgrades handled in-house. Per its March 2026 draft red herring prospectus the
  company operates across 22 Indian cities with 227,511 live subscribers and 1,688
  in-house technicians, carpenters and painters. Backed by Accel and Bain Capital
  Ventures. Added to the API Evangelist network from VC portfolio data; this pass
  found no public developer API, SDK or documentation surface.'
